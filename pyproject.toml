[project]
name = "vocab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "google-api-python-client>=2.100",
  "google-auth>=2.23",
  "genanki>=0.13",
  "requests>=2.31",
  "python-docx>=1.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["vocab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
